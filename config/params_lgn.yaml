# ======================================================================
# LGN phosphene simulator parameters
# ======================================================================
# Adapted from config/params.yaml (V1 / cortex). Every number the
# dynaphos_lgn package uses lives here; code reads it through
# `dynaphos_lgn.params.require`.
#
# Currents are in AMPERES, as in the parent Dynaphos config;
# `run.current_unit_to_ua` converts to microamperes at the simulator
# boundary.
# ======================================================================

run:
  resolution: [256, 256]      # [width, height] in pixels
  view_angle: 16              # horizontal field of view, degrees
  origin: [0, 0]
  min_angle: 0.001            # minimal eccentricity, degrees
  fps: 35
  gpu: 0
  print_stats: False
  seed: 42
  dtype: float32
  batch_size: 0               # 0 when not used for batched optimisation
  current_unit_to_ua: 1.0e+6  # amperes -> microamperes

display:
  screen_resolution: [1920, 1080]
  screen_diagonal: 13.3       # inches
  dist_to_screen: 600         # mm

# ----------------------------------------------------------------------
# Atlas: Erwin, Baker, Busen & Malpeli (1999), one left macaque LGN
# ----------------------------------------------------------------------
atlas:
  directory: data/Erwin_Atlas
  jacobian_cache: JACOBIAN.npz
  jacobian_cache_konio: JACOBIAN_KONIO.npz   # fit including K layers

  shape_ml_dv_ap: [240, 280, 320]
  voxel_size_mm: 0.025
  file_order: F

  # Which nuclei to simulate. The left LGN covers the right hemifield;
  # 'right' is the left atlas mirrored across the midline. Widen
  # run.view_angle when simulating both.
  hemispheres: [left]           # [left] | [right] | [left, right]
  mirror:
    ml_axis: 0                  # index of ML in shape_ml_dv_ap

  # `scale` divides the stored integer to give the physical value.
  # `bytes_per_voxel` is checked against the file size by build.py.
  files:
    eccentricity:
      name: ECC.DAT
      dtype: int16
      bytes_per_voxel: 2
      scale: 10.0
    inclination:
      name: INCL.DAT
      dtype: int16
      bytes_per_voxel: 2
      scale: 1.0
    layer:
      name: LAYERS.DAT
      dtype: int8
      bytes_per_voxel: 1
      scale: 1.0
    cells:
      name: CELLS.DAT
      dtype: int16
      bytes_per_voxel: 2
      scale: 1000.0

  # "Not applicable" markers
  sentinels:
    eccentricity_inclination: 999
    layer: 0
    cells: 0

  # Horsley-Clarke position of voxel (0, 0, 0); indices increase
  # lateral / dorsal / anterior.
  horsley_clarke_origin_mm:
    ml: 8.5
    dv: -1.5
    ap: 3.5

  layers:
    # LAYERS.DAT codes. "contra"/"ipsi" is the eye of origin, not the
    # hemifield.
    names:
      1: magno_contra
      2: magno_ipsi
      3: parvo_ipsi
      4: parvo_contra
      # Koniocellular layers K1-K6, labelled in the interlaminar zones
      # at load time when konio.enabled (not stored in LAYERS.DAT).
      5: konio_1
      6: konio_2
      7: konio_3
      8: konio_4
      9: konio_5
      10: konio_6
    classes:
      magno: [1, 2]
      parvo: [3, 4]
      konio: [5, 6, 7, 8, 9, 10]
    # Groupings within a class. Ventral K1-K2 and dorsal K3-K6 differ in
    # their V1 axon arbors (Casagrande et al. 2007).
    subclasses:
      konio_ventral: [5, 6]
      konio_dorsal: [7, 8, 9, 10]
    eyes:
      contra: [1, 4]
      ipsi: [2, 3]

  # Placeholder inclination for voxels representing the ipsilateral
  # hemifield.
  ipsi_flat_inclination_deg: 135.0
  exclude_ipsi_flat_inclination: True

  # Within this radius the atlas's retinotopy is isotropic by
  # construction.
  isotropic_construction_radius_deg: 1.0

  max_eccentricity_deg:
    parvo: 90.5
    magno: 96.6

  jacobian:
    neighborhood_radius_vox: 1
    min_neighbors: 10
    ridge: 1.0e-8
    transition_probe_distance_vox: 20   # 500 um
    transition_residual_threshold_deg: 1.0
    svd_chunk_size: 2000000

# ----------------------------------------------------------------------
# Koniocellular layers (speculative; no macaque K density data exists)
# ----------------------------------------------------------------------
# Cell classes in the model. Add konio to label the interlaminar zones
# as koniocellular layers.
cell_classes: [magno, parvo]

konio:
  # K share of all LGN cells: P 80%, M 10%, K 10% (Connolly & Van Essen
  # 1984; Hendry 1995), spread uniformly over the K voxels.
  fraction_of_total: 0.10
  # Longer interlaminar runs are hilum or fibre bundles, not K layers.
  # K layers are ~100 um thick (Kaas et al. 1978).
  max_run_thickness_vox: 12     # 300 um

# ----------------------------------------------------------------------
# Synthetic stand-in atlas, for tests and demos without the real data
# ----------------------------------------------------------------------
synthetic_atlas:
  shape_ml_dv_ap: [96, 64, 200]
  max_eccentricity_deg: 40.0
  eccentricity_scale_deg: 2.0    # E0 in E(s) = E0 * (exp(s/lambda) - 1)
  n_layers: 4
  inclination_span_deg: 120.0
  margin_vox: 4
  seed: 0
  density_half_eccentricity_deg: 5.0   # density = 1 / (1 + E/this)
  density_jitter_sd: 0.05

# ----------------------------------------------------------------------
# Electrode array
# ----------------------------------------------------------------------
electrodes:
  n_electrodes: 64              # per nucleus
  n_electrodes_by_hemisphere:   # null: use n_electrodes
    left: null
    right: null
  cell_class: null              # null (all tissue) | a class or subclass
                                # | a list, e.g. [magno, parvo]
  min_eccentricity_deg: 0.0
  max_eccentricity_deg: 20.0
  bin_size_deg: 0.5
  depth_selection: random       # central | random
  # Largest current the array is precomputed for.
  max_current_ua: 100.0
  max_candidate_voxels: 40000   # budget; a voxel stride is chosen to fit
  n_scatter_points: 512
  position_fallback_radius_vox: 4   # neighbourhood averaged when an
                                    # electrode lands on a placeholder

# ----------------------------------------------------------------------
# Sampling from images / video
# ----------------------------------------------------------------------
sampling:
  sampling_method: receptive_fields   # receptive_fields | center
  rf_cell_class: parvo                # parvo | magno | konio
  rf_form: exponential                # exponential | power
  rf_size_scale: 1.0                  # multiplier on rc(E)
  stimulus_scale: 1.0e-4

# ----------------------------------------------------------------------
# Current spread and recruitment
# ----------------------------------------------------------------------
current_spread:
  k_ua_per_mm2: 675.0           # macaque V1 (Tehovnik et al. 2006)

  spread_model: stoney          # stoney (D = 2 sqrt(I/K)) | bosking
  kernel_shape: gaussian        # gaussian | logistic
  contour_value: 0.1353352832366127   # 1/e^2, kernel weight at the
                                      # spread radius
  logistic_softness: 0.25
  tail_weight: 0.01             # where the candidate gather is truncated

  # Saturating shape from Bosking et al. (2017), with Dynaphos's V1
  # slope and half-current.
  bosking:
    max_diameter_mm: 5.3
    slope_per_ua: 0.08
    i_half_ua: 40.0

  class_scaling: none           # none | diameter | diameter_squared
  class_scaling_reference: parvo
  nucleolus_diameter_um:
    parvo: 2.25
    magno: 3.00

recruitment:
  distance_histogram_bins: 192

# ----------------------------------------------------------------------
# Magnification
# ----------------------------------------------------------------------
magnification:
  model: jacobian               # jacobian | atlas_gradient |
                                # anisotropic_gradient | malpeli_density

  # Malpeli, Lee & Baker (1996), Eqs 1-2: cell density, cells/deg^2.
  malpeli:
    parvo:                      # a * (E + e0) ** exponent
      a: 1011688.0
      e0: 2.9144
      exponent: -2.6798
    magno:                      # a * ((E - e0)^2 + c) ** exponent
      a: 2620.2
      e0: 1.8322
      c: 5.5638
      exponent: -0.8012

  # Converts Malpeli's density to a linear magnification.
  density_derived:
    cells_per_mm3:              # null: derive from the atlas's CELLS.DAT
      parvo: null
      magno: null
    # Summed same-class laminar thickness, (low, central, high) mm.
    # Either one triple or a mapping with a `parvo` and a `magno` triple.
    column_thickness_mm: [1.0, 3.0, 5.0]

  eccentricity_table_bin_width_deg: 1.0

  # 2-D (eccentricity, inclination) table for
  # AnisotropicGradientMagnification. Keep the inclination bins narrow:
  # the atlas has a ~5-10 deg wide discontinuity near -15 deg.
  anisotropic_gradient:
    eccentricity_bin_width_deg: 2.0
    inclination_bin_width_deg: 2.0
    min_voxels_per_bin: 20
    outlier_z_threshold: 4.0    # robust z against the eccentricity row
    orientation_reliable_min_anisotropy: 1.05   # below: orientation = 0

# ----------------------------------------------------------------------
# Receptive fields
# ----------------------------------------------------------------------
receptive_fields:
  cell_classes: [magno, parvo, konio, konio_ventral, konio_dorsal]

  # Fits to digitised Croner & Kaplan (1995) Fig. 4.
  croner_kaplan:
    exponential:                # rc = a * exp(b * E)
      magno: {a_deg: 0.096236, b_per_deg: 0.032755, r2_log: 0.619, n: 18,
              ecc_range_deg: [3.56, 32.15]}
      parvo: {a_deg: 0.032349, b_per_deg: 0.049124, r2_log: 0.631, n: 80,
              ecc_range_deg: [0.66, 35.16]}
    power:                      # rc = a * E^b
      magno: {a_deg: 0.046784, b: 0.473278, r2_log: 0.727}
      parvo: {a_deg: 0.024392, b: 0.399947, r2_log: 0.511}
    surround_center_radius_ratio:   # rs/rc
      parvo: 6.7
      magno: 4.8

  # Xu, Bonds & Casagrande (2002), owl monkey.
  xu_konio:
    rc_slope_per_deg: 0.063
    rc_intercept_deg: -0.31
    rc_r2: 0.59
    rs_slope_per_deg: 0.067
    rs_intercept_deg: 0.28
    rc_below_15deg: [0.31, 0.05]    # mean, sd; also the floor for the
    rs_below_15deg: [0.91, 0.10]    # linear fits
    rs_over_rc_below_15deg: 3.61

  # Subclasses use their parent's fit times this scale: White et al.
  # (2001, marmoset) ventral 0.36 deg and dorsal 0.22 deg centres,
  # relative to their geometric mean.
  subclass_rc_scale:
    konio_ventral: 1.28
    konio_dorsal: 0.78

  # Integrated surround/centre ratio (Ks*rs^2)/(Kc*rc^2), not the peak
  # ratio Ks/Kc.
  surround_center_volume_ratio:
    magno: 0.55
    parvo: 0.55
    konio: 0.77

# ----------------------------------------------------------------------
# Phosphene size and rendering
# ----------------------------------------------------------------------
size:
  # Used by the V1 simulator only; the LGN path derives sigma from
  # current_spread.contour_value.
  radius_to_sigma: 0.5

# How recruited cell classes combine into a phosphene.
#   single         one blob per electrode, class-blind
#   class_mixture  one blob per class, widened by that class's receptive-
#                  field centre and weighted by its share of recruited cells
percept:
  model: single                 # single | class_mixture
  classes: null                 # null: cell_classes
  rf_blur_scale: 1.0            # multiplier on the RF centre sigma
  rf_form: exponential          # exponential | power (M/P fits)

rendering:
  adaptive_scatter_bandwidth: True
  scatter_bandwidth_floor_pixels: 0.5
  scatter_bandwidth_ceiling_fraction: 0.2   # of the patch radius
  scatter_patch_radius_percentile: 99.5
  scatter_patch_radius_margin: 1.25
  scatter_extent_percentile: 95
  smooth_clamp_softness_fraction: 0.05
  max_kernel_radius_px: 12

# ----------------------------------------------------------------------
# Temporal dynamics (from the V1 model)
# ----------------------------------------------------------------------
temporal_dynamics:
  trace_increase_rate: 13.95528162
  activation_decay_per_second: 0.00012340980408667956
  trace_decay_per_second: 0.99949191

brightness_saturation:
  cps_half: 1.057631326853325e-07
  slope_brightness: 19152642.500946816

# ----------------------------------------------------------------------
# Thresholding
# ----------------------------------------------------------------------
thresholding:
  use_threshold: True
  rheobase: 23.9e-6             # human V1 (Fernandez et al. 2021)
  activation_threshold: 9.141886000943878e-08
  activation_threshold_sd: 6.715877869833961e-08
  # Logistic detection curve instead of a hard step, so electrodes
  # below threshold still get a gradient. Thresholds already vary
  # between electrodes with activation_threshold_sd, so the logistic is
  # kept narrow: at 10 / sd the simulated psychometric curve keeps the
  # calibrated spread (1 / sd widens it by ~40%, see
  # experiments/reproduction/).
  soft_threshold: True
  soft_threshold_slope: null    # null -> 10 / activation_threshold_sd
  # What the logistic returns at zero activation:
  #   none             plain logistic (p(0) is about 1e-6 for a typical
  #                    threshold, 0.5 for thresholds clipped to 0)
  #   zero_activation  p(a) = (S(a) - S(0)) / (1 - S(0)), so p(0) = 0
  soft_threshold_baseline: zero_activation

default_stim:
  relative_stim_duration: 1
  pw_default: 170.e-6           # seconds
  freq_default: 300             # Hertz
  # Largest amplitude optimised stimulation may use. At most
  # electrodes.max_current_ua.
  safety_limit_ua: 100.0
  chronaxie_range_s: [30.e-6, 200.e-6]

# ----------------------------------------------------------------------
# Benchmarks: measured values
# ----------------------------------------------------------------------
benchmarks:
  pezaris_2007:                 # Pezaris & Reid (2007), macaque LGN
    threshold_ua: [40.0, 12.0]          # mean, sd
    accuracy_deg: [2.3, 1.2]
    repeatability_deg: [0.8, 0.6]
  # Multi-electrode threshold reduction: low-overlap limit from Callier
  # et al. (2015), high-overlap limit from Kunigk et al. (2022).
  multi_electrode:
    low_overlap_max_reduction: 0.10
    field_summation_max_reduction: 0.66
    field_summation_vanishes_at_radii: 2.0
    saturates_at_n_electrodes: 4

# ----------------------------------------------------------------------
# Validation: Erwin et al. (1999)'s published totals, checked by build.py
# ----------------------------------------------------------------------
validation:
  erwin_1999:
    magno_cells: 104841
    parvo_cells: 1048571
    volume_mm3: 57.1
    mean_density_per_voxel: 0.312
    max_density_per_voxel: 1.018
    reconstruction_accuracy_um: [211, 217]
  report_eccentricity_edges: [0, 1, 5, 10, 20, 30, 90]
  jacobian_report_sample_size: 400000
  jacobian_report_seed: 0
